<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CycleTracking</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="header">
    <div><strong>CycleTracking</strong> <span class="sub">v0.1 alpha</span></div>
    <label class="lang"><span>🌐</span><select id="language" aria-label="Language">
      <option value="es-MX">Español</option><option value="en">English</option><option value="zh-CN">中文</option>
    </select></label>
  </header>
  <main class="wrap">
    <h1 id="title">CycleTracking</h1>
    <p id="alpha" class="banner" role="note">Versión inicial de pruebas.</p>
    <section id="login-panel" class="panel">
      <form id="login-form" class="form">
        <label><span id="label-user">Usuario</span><input id="username" autocomplete="username" required maxlength="64"></label>
        <label><span id="label-password">Contraseña</span><input id="password" type="password" autocomplete="current-password" required></label>
        <button id="login-btn" type="submit">Entrar</button>
      </form>
    </section>
    <section id="work-panel" hidden>
      <div class="toolbar">
        <span id="identity"></span><button id="logout-btn" class="secondary" type="button">Cerrar sesión</button>
      </div>
      <div class="grid">
        <section class="panel">
          <h2 id="asset-title">Equipos registrados</h2>
          <form id="search-form" class="row">
            <input id="search" aria-label="Search equipment" placeholder="Buscar serie, IMEI o QR" maxlength="128">
            <button id="search-btn">Buscar</button>
          </form>
          <ul id="assets" class="asset-list"></ul>
        </section>
        <section class="panel">
          <h2 id="detail-title">Expediente</h2>
          <div id="details" class="muted">Selecciona un equipo.</div>
          <ul id="events" class="timeline"></ul>
          <form id="observe-form" class="form" hidden>
            <h3 id="observe-title">Agregar observación</h3>
            <select id="observation-kind">
              <option value="MISSING_REPORTED">MISSING_REPORTED</option>
              <option value="STOLEN_REPORTED">STOLEN_REPORTED</option>
              <option value="DAMAGED_REPORTED">DAMAGED_REPORTED</option>
              <option value="SEIZED_REPORTED">SEIZED_REPORTED</option>
              <option value="FOUND_REPORTED">FOUND_REPORTED</option>
              <option value="DOCUMENT_RECORDED">DOCUMENT_RECORDED</option>
            </select>
            <textarea id="observation-note" required minlength="5" maxlength="4000" placeholder="Describe el hecho y su procedencia"></textarea>
            <button id="observe-btn">Registrar observación</button>
          </form>
          <form id="decision-form" class="form" hidden>
            <h3 id="decision-title">Confirmar estado patrimonial</h3>
            <select id="decision-status">
              <option>AVAILABLE</option><option>DEPLOYED</option><option>IN_MAINTENANCE</option>
              <option>MISSING</option><option>STOLEN</option><option>SEIZED</option>
              <option>DAMAGED</option><option>RETURNED</option><option>RETIRED</option>
            </select>
            <textarea id="decision-note" required minlength="5" maxlength="4000" placeholder="Justificación de la decisión"></textarea>
            <button id="decision-btn">Confirmar decisión</button>
          </form>
        </section>
      </div>
      <section class="panel" id="create-panel" hidden>
        <h2 id="create-title">Alta de equipos</h2>
        <form id="create-form" class="row">
          <input id="equipment-type" required maxlength="60" minlength="2" placeholder="Tipo: NODE, RADIO, PHONE...">
          <input id="technology" maxlength="60" placeholder="Tecnología (opcional)">
          <select id="identifier-kind"><option>SERIAL</option><option>IMEI</option><option>QR</option><option>ECONOMIC</option></select>
          <input id="identifier" required maxlength="128" minlength="2" placeholder="Serie / IMEI / QR">
          <button id="create-btn">Registrar equipo</button>
        </form>
      </section>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
